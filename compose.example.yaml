services:
  feedway:
    image: ghcr.io/zewelor/feedway:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_TOKEN: ${API_TOKEN:?API_TOKEN is required}
      BASE_URL: ${BASE_URL:-}
      DB_HOST: postgres
      DB_NAME: feedway
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_PORT: 5432
      DB_SSLMODE: disable
      DB_USER: feedway
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    ports:
      - "8080:80"
    read_only: true
    restart: unless-stopped
    stop_grace_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_DB: feedway
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_USER: feedway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedway -d feedway"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
