services:
  markdownlint:
    image: davidanson/markdownlint-cli2:v0.24.1@sha256:caf0698eaea0268bcf35b5e2d7ba946b5899d323e765bc2862054405658cd948
    working_dir: /workdir
    volumes:
      - .:/workdir
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18.7-trixie@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
    environment:
      POSTGRES_DB: feedway_test
      POSTGRES_PASSWORD: feedway_test
      POSTGRES_USER: feedway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedway -d feedway_test"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql

  test:
    image: feedway-ci:latest
    build:
      context: .
      target: ci
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: feedway_test
      DB_PASSWORD: feedway_test
      DB_PORT: 5432
      DB_USER: feedway
      GOCACHE: /tmp/go-build
      GOLANGCI_LINT_CACHE: /tmp/golangci-lint
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
