services:
  markdownlint:
    image: davidanson/markdownlint-cli2:v0.24.2@sha256:c768e94d8bb161c449bde28f60656929ca1f02c3010a405f65c9cac71563a889
    working_dir: /workdir
    volumes:
      - .:/workdir
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18.7-trixie@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_DB: feedway_test
      POSTGRES_PASSWORD: feedway_test
      POSTGRES_USER: feedway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedway -d feedway_test"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql

  test:
    image: feedway-ci:latest
    build:
      context: .
      target: ci
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: feedway_test
      DB_PASSWORD: feedway_test
      DB_PORT: 5432
      DB_USER: feedway
      GOCACHE: /tmp/go-build
      GOLANGCI_LINT_CACHE: /tmp/golangci-lint
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
