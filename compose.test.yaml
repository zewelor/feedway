services:
  postgres:
    image: postgres:18.7-trixie@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
    environment:
      POSTGRES_DB: feedway_test
      POSTGRES_PASSWORD: feedway_test
      POSTGRES_USER: feedway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U feedway -d feedway_test"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "127.0.0.1:15432:5432"
