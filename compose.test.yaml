services:
  markdownlint:
    image: davidanson/markdownlint-cli2:v0.24.0@sha256:70ead7c0352d22d04bbe612cd96b54ec591538d8f4626cafe391bb2ecf3639ca
    working_dir: /workdir
    volumes:
      - .:/workdir
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_DB: feedway_test
      POSTGRES_PASSWORD: feedway_test
      POSTGRES_USER: feedway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedway -d feedway_test"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql

  test:
    image: feedway-ci:latest
    build:
      context: .
      target: ci
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: feedway_test
      DB_PASSWORD: feedway_test
      DB_PORT: 5432
      DB_USER: feedway
      GOCACHE: /tmp/go-build
      GOLANGCI_LINT_CACHE: /tmp/golangci-lint
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
